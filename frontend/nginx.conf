server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    resolver 8.8.8.8 valid=30s;

    location /api/ {
        set $backend https://my-app-backend-mmcx.onrender.com;
        proxy_pass $backend;
        proxy_ssl_server_name on;
        proxy_set_header Host my-app-backend-mmcx.onrender.com;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}